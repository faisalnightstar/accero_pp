<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="acceroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D3557" />
      <stop offset="100%" stop-color="#8B1E2D" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946" />
      <stop offset="100%" stop-color="#8B1E2D" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base (Rounded Rect) -->
  <rect width="512" height="512" rx="112" fill="url(#acceroGrad)" />

  <!-- Inner CR80 Geometric Card Silhouette -->
  <g filter="url(#shadow)">
    <rect x="76" y="116" width="360" height="230" rx="24" fill="#FFFFFF" />
    <!-- Chip / Security Accent -->
    <rect x="112" y="166" width="56" height="42" rx="8" fill="#F4D35E" />
    <path d="M112 187 h56 M140 166 v42" stroke="#D4A718" stroke-width="2" />
    <!-- Identity Lines -->
    <rect x="190" y="170" width="180" height="14" rx="4" fill="#1D3557" />
    <rect x="190" y="196" width="120" height="10" rx="3" fill="#64748B" />
    <!-- Bottom Print Accent Bar -->
    <rect x="112" y="290" width="288" height="12" rx="4" fill="url(#accentGrad)" />
  </g>

  <!-- Modern Stylized "A" Monogram Mark Overlay -->
  <path d="M256 180 L340 370 H294 L276 324 H236 L218 370 H172 Z M256 244 L244 286 H268 Z" fill="#8B1E2D" />
</svg>
