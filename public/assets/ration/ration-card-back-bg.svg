<svg width="1011" height="638" viewBox="0 0 1011 638" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-back-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFDFD"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="back-top-ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="back-guilloche" width="60" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0 15 Q 15 0 30 15 T 60 15 M 0 20 Q 15 5 30 20 T 60 20 M 0 10 Q 15 -5 30 10 T 60 10" fill="none" stroke="#1E3A8A" stroke-width="0.5" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- Base Card Rectangle with 3.18mm standard radius -->
  <rect x="0" y="0" width="1011" height="638" rx="38" fill="url(#bg-back-gradient)"/>
  <rect x="0" y="0" width="1011" height="638" rx="38" fill="url(#back-guilloche)"/>

  <!-- Top Accent Ribbon -->
  <rect x="0" y="0" width="1011" height="12" fill="url(#back-top-ribbon)"/>

  <!-- Subtle Microtext Border Line -->
  <rect x="18" y="18" width="975" height="602" rx="28" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Bottom Dark Security Band Placeholder -->
  <rect x="0" y="550" width="1011" height="88" fill="#0F172A" opacity="0.04"/>
</svg>
